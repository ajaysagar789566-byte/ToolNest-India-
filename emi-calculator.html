<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMI Calculator - Free Loan EMI Calculator | ToolNest India</title>

    <meta name="description"
        content="Calculate monthly loan EMI, total interest and total payment with our free EMI calculator.">

    <link rel="stylesheet" href="style.css">

    <style>
        .calculator-page {
            max-width: 700px;
            margin: auto;
            padding: 35px 20px;
        }

        .calculator-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .calculator-box label {
            display: block;
            font-weight: bold;
            margin: 15px 0 8px;
        }

        .calculator-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .calculate-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f5ff;
            border-radius: 12px;
        }

        .result p {
            margin: 12px 0;
        }

        .emi {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .error {
            display: none;
            color: #dc2626;
            margin-top: 12px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolNest<span> India</span></div>

    <button id="menuBtn">☰</button>

    <nav id="nav">
        <a href="index.html">Home</a>
        <a href="index.html#calculators">Calculators</a>
        <a href="index.html#tools">Tools</a>
        <a href="index.html#about">About</a>
    </nav>
</header>

<main>

    <div class="ad-box">
        Advertisement
    </div>

    <section class="calculator-page">

        <a class="back-btn" href="index.html">
            ← Back to Home
        </a>

        <h1>EMI Calculator</h1>

        <p>
            Calculate your monthly loan EMI, total interest and total
            payment.
        </p>

        <br>

        <div class="calculator-box">

            <label for="loan">
                Loan Amount (₹)
            </label>

            <input
                type="number"
                id="loan"
                placeholder="Example: 500000"
            >

            <label for="rate">
                Annual Interest Rate (%)
            </label>

            <input
                type="number"
                id="rate"
                step="0.01"
                placeholder="Example: 8.5"
            >

            <label for="years">
                Loan Duration (Years)
            </label>

            <input
                type="number"
                id="years"
                step="0.1"
                placeholder="Example: 5"
            >

            <button
                class="calculate-btn"
                onclick="calculateEMI()"
            >
                Calculate EMI
            </button>

            <p class="error" id="error">
                Please enter valid values.
            </p>

            <div class="result" id="result">

                <p>Monthly EMI</p>

                <div class="emi" id="emi"></div>

                <p id="interest"></p>

                <p id="total"></p>

            </div>

        </div>

    </section>

</main>

<footer>

    <p>© 2026 ToolNest India</p>

    <div>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
    </div>

</footer>


<script>

const menuBtn = document.getElementById("menuBtn");
const nav = document.getElementById("nav");

menuBtn.addEventListener("click", function () {
    nav.classList.toggle("show");
});


function calculateEMI() {

    const loan =
        parseFloat(document.getElementById("loan").value);

    const annualRate =
        parseFloat(document.getElementById("rate").value);

    const years =
        parseFloat(document.getElementById("years").value);

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    if (
        isNaN(loan) ||
        isNaN(annualRate) ||
        isNaN(years) ||
        loan <= 0 ||
        annualRate < 0 ||
        years <= 0
    ) {
        error.style.display = "block";
        result.style.display = "none";
        return;
    }

    error.style.display = "none";

    const monthlyRate =
        annualRate / 12 / 100;

    const months =
        years * 12;

    let emi;

    if (monthlyRate === 0) {

        emi = loan / months;

    } else {

        emi =
            loan *
            monthlyRate *
            Math.pow(1 + monthlyRate, months) /
            (Math.pow(1 + monthlyRate, months) - 1);
    }

    const totalPayment =
        emi * months;

    const totalInterest =
        totalPayment - loan;


    document.getElementById("emi").textContent =
        "₹" + Math.round(emi).toLocaleString("en-IN");

    document.getElementById("interest").textContent =
        "Total Interest: ₹" +
        Math.round(totalInterest).toLocaleString("en-IN");

    document.getElementById("total").textContent =
        "Total Payment: ₹" +
        Math.round(totalPayment).toLocaleString("en-IN");

    result.style.display = "block";
}

</script>

</body>
</html>
