<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator - Calculate Your Exact Age | ToolNest India</title>

    <meta name="description"
        content="Free age calculator to calculate your exact age in years, months and days. Find your next birthday and total days lived.">

    <link rel="stylesheet" href="style.css">

    <style>
        .calculator-page {
            max-width: 700px;
            margin: auto;
            padding: 35px 20px;
        }

        .calculator-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .calculator-box label {
            display: block;
            font-weight: bold;
            margin: 15px 0 8px;
        }

        .calculator-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .calculate-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f5ff;
            border-radius: 12px;
        }

        .result h2 {
            margin-bottom: 15px;
        }

        .age-number {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .result p {
            margin: 10px 0;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolNest<span> India</span></div>

    <button id="menuBtn">☰</button>

    <nav id="nav">
        <a href="index.html">Home</a>
        <a href="index.html#calculators">Calculators</a>
        <a href="index.html#tools">Tools</a>
        <a href="index.html#about">About</a>
    </nav>
</header>

<main>

    <div class="ad-box">
        Advertisement
    </div>

    <section class="calculator-page">

        <a class="back-btn" href="index.html">
            ← Back to Home
        </a>

        <h1>Age Calculator</h1>

        <p>
            Enter your date of birth to calculate your exact age in
            years, months and days.
        </p>

        <br>

        <div class="calculator-box">

            <label for="birthDate">
                Date of Birth
            </label>

            <input
                type="date"
                id="birthDate"
            >

            <button
                class="calculate-btn"
                onclick="calculateAge()"
            >
                Calculate Age
            </button>

            <p class="error" id="error">
                Please enter a valid date of birth.
            </p>

            <div class="result" id="result">

                <h2>Your Exact Age</h2>

                <div
                    class="age-number"
                    id="ageResult"
                ></div>

                <p id="nextBirthday"></p>

                <p id="totalDays"></p>

            </div>

        </div>

    </section>

    <div class="ad-box">
        Advertisement
    </div>

</main>

<footer>

    <p>© 2026 ToolNest India</p>

    <div>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
    </div>

</footer>


<script>

const menuBtn = document.getElementById("menuBtn");
const nav = document.getElementById("nav");

menuBtn.addEventListener("click", function () {
    nav.classList.toggle("show");
});


function calculateAge() {

    const birthInput =
        document.getElementById("birthDate").value;

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    if (!birthInput) {
        error.style.display = "block";
        result.style.display = "none";
        return;
    }

    const birthDate =
        new Date(birthInput + "T00:00:00");

    const today = new Date();

    if (birthDate > today) {
        error.textContent =
            "Date of birth cannot be in the future.";

        error.style.display = "block";
        result.style.display = "none";
        return;
    }

    error.style.display = "none";

    let years =
        today.getFullYear() -
        birthDate.getFullYear();

    let months =
        today.getMonth() -
        birthDate.getMonth();

    let days =
        today.getDate() -
        birthDate.getDate();

    if (days < 0) {

        months--;

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

        days += previousMonth.getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }


    document.getElementById("ageResult").textContent =
        years + " Years, " +
        months + " Months, " +
        days + " Days";


    // Total days

    const difference =
        today.getTime() -
        birthDate.getTime();

    const totalDays =
        Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );

    document.getElementById("totalDays").textContent =
        "Total days lived: " +
        totalDays.toLocaleString();


    // Next birthday

    let nextBirthday =
        new Date(
            today.getFullYear(),
            birthDate.getMonth(),
            birthDate.getDate()
        );

    if (nextBirthday < today) {

        nextBirthday =
            new Date(
                today.getFullYear() + 1,
                birthDate.getMonth(),
                birthDate.getDate()
            );
    }

    const diffBirthday =
        Math.ceil(
            (nextBirthday - today) /
            (1000 * 60 * 60 * 24)
        );

    document.getElementById("nextBirthday").textContent =
        "Days until your next birthday: " +
        diffBirthday;


    result.style.display = "block";
}

</script>

</body>
</html>
