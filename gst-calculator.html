<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GST Calculator - Free GST Calculator | ToolNest India</title>

    <meta name="description"
        content="Calculate GST amount and total price instantly with our free GST calculator.">

    <link rel="stylesheet" href="style.css">

    <style>
        .calculator-page {
            max-width: 700px;
            margin: auto;
            padding: 35px 20px;
        }

        .calculator-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .calculator-box label {
            display: block;
            font-weight: bold;
            margin: 15px 0 8px;
        }

        .calculator-box input,
        .calculator-box select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .calculate-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f5ff;
            border-radius: 12px;
        }

        .result p {
            margin: 12px 0;
        }

        .total {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .error {
            display: none;
            color: #dc2626;
            margin-top: 12px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolNest<span> India</span></div>

    <button id="menuBtn">☰</button>

    <nav id="nav">
        <a href="index.html">Home</a>
        <a href="index.html#calculators">Calculators</a>
        <a href="index.html#tools">Tools</a>
        <a href="index.html#about">About</a>
    </nav>
</header>

<main>

    <div class="ad-box">
        Advertisement
    </div>

    <section class="calculator-page">

        <a class="back-btn" href="index.html">
            ← Back to Home
        </a>

        <h1>GST Calculator</h1>

        <p>
            Calculate GST amount and total price quickly and easily.
        </p>

        <br>

        <div class="calculator-box">

            <label for="amount">
                Amount (₹)
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Example: 1000"
            >

            <label for="gstRate">
                GST Rate
            </label>

            <select id="gstRate">

                <option value="5">5%</option>
                <option value="12">12%</option>
                <option value="18" selected>18%</option>
                <option value="28">28%</option>

            </select>

            <button
                class="calculate-btn"
                onclick="calculateGST()"
            >
                Calculate GST
            </button>

            <p class="error" id="error">
                Please enter a valid amount.
            </p>

            <div class="result" id="result">

                <p id="gstAmount"></p>

                <div class="total" id="totalAmount"></div>

            </div>

        </div>

    </section>

</main>

<footer>

    <p>© 2026 ToolNest India</p>

    <div>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
    </div>

</footer>


<script>

const menuBtn = document.getElementById("menuBtn");
const nav = document.getElementById("nav");

menuBtn.addEventListener("click", function () {
    nav.classList.toggle("show");
});


function calculateGST() {

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const rate =
        parseFloat(
            document.getElementById("gstRate").value
        );

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    if (
        isNaN(amount) ||
        amount <= 0
    ) {
        error.style.display = "block";
        result.style.display = "none";
        return;
    }

    error.style.display = "none";

    const gst =
        amount * rate / 100;

    const total =
        amount + gst;

    document.getElementById("gstAmount").textContent =
        "GST Amount: ₹" +
        gst.toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });

    document.getElementById("totalAmount").textContent =
        "Total: ₹" +
        total.toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });

    result.style.display = "block";
}

</script>

</body>
</html>
