<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - Free Online Tool | ToolNest India</title>

    <meta name="description"
        content="Free percentage calculator. Calculate percentage, percentage increase, decrease and more easily.">

    <link rel="stylesheet" href="style.css">

    <style>
        .calculator-page {
            max-width: 700px;
            margin: auto;
            padding: 35px 20px;
        }

        .calculator-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .calculator-box label {
            display: block;
            font-weight: bold;
            margin: 15px 0 8px;
        }

        .calculator-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .calculate-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f5ff;
            border-radius: 12px;
        }

        .result h2 {
            margin-bottom: 15px;
        }

        .result-number {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .error {
            display: none;
            color: #dc2626;
            margin-top: 12px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolNest<span> India</span></div>

    <button id="menuBtn">☰</button>

    <nav id="nav">
        <a href="index.html">Home</a>
        <a href="index.html#calculators">Calculators</a>
        <a href="index.html#tools">Tools</a>
        <a href="index.html#about">About</a>
    </nav>
</header>

<main>

    <div class="ad-box">
        Advertisement
    </div>

    <section class="calculator-page">

        <a class="back-btn" href="index.html">
            ← Back to Home
        </a>

        <h1>Percentage Calculator</h1>

        <p>
            Calculate what percentage one number is of another number.
        </p>

        <br>

        <div class="calculator-box">

            <label for="percentage">
                Percentage (%)
            </label>

            <input
                type="number"
                id="percentage"
                placeholder="Example: 20"
            >

            <label for="number">
                Number
            </label>

            <input
                type="number"
                id="number"
                placeholder="Example: 500"
            >

            <button
                class="calculate-btn"
                onclick="calculatePercentage()"
            >
                Calculate Percentage
            </button>

            <p class="error" id="error">
                Please enter valid numbers.
            </p>

            <div class="result" id="result">

                <h2>Result</h2>

                <div
                    class="result-number"
                    id="answer"
                ></div>

                <p id="explanation"></p>

            </div>

        </div>

    </section>

</main>

<footer>

    <p>© 2026 ToolNest India</p>

    <div>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
    </div>

</footer>


<script>

const menuBtn = document.getElementById("menuBtn");
const nav = document.getElementById("nav");

menuBtn.addEventListener("click", function () {
    nav.classList.toggle("show");
});


function calculatePercentage() {

    const percentage =
        parseFloat(
            document.getElementById("percentage").value
        );

    const number =
        parseFloat(
            document.getElementById("number").value
        );

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    if (
        isNaN(percentage) ||
        isNaN(number)
    ) {
        error.style.display = "block";
        result.style.display = "none";
        return;
    }

    error.style.display = "none";

    const answer =
        (percentage / 100) * number;

    document.getElementById("answer").textContent =
        answer.toLocaleString();

    document.getElementById("explanation").textContent =
        percentage + "% of " +
        number +
        " = " +
        answer;

    result.style.display = "block";
}

</script>

</body>
</html>
